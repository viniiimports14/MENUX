<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENUX | Entrar</title><style>:root{--bg:#0d0e10;--panel:#17191d;--line:#2b2e34;--gold:#c9a45a;--text:#f5f3ee;--muted:#a4a6ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Arial}.wrap{max-width:1050px;margin:35px auto;padding:18px}.auth{max-width:420px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}h1{color:var(--gold);letter-spacing:2px}h2{font-size:19px}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}input,select{width:100%;padding:12px;border:1px solid var(--line);background:#111317;border-radius:9px;color:var(--text)}button,.button{background:var(--gold);color:#18140e;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#292b31;color:var(--text)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;margin:16px 0}.muted{color:var(--muted)}.error{color:#ff9c91}.ok{color:#75d9a3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}@media(max-width:650px){.wrap{margin:8px auto}.auth{margin:5vh 12px;padding:22px}table{font-size:12px}}</style></head><body><main class="auth"><h1>◈ MENUX</h1><p class="muted">FOOD PLATFORM · Acesso seguro</p><h2>Entre na sua conta</h2><form id="form"><label>E-mail</label><input type="email" id="email" required autocomplete="username"><label>Senha</label><input type="password" id="password" required autocomplete="current-password"><button style="width:100%;margin-top:22px">Entrar</button></form><p id="message" class="error" role="alert"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>function client(){const c=window.MENUX_CONFIG||{};if(!c.supabaseUrl?.startsWith('https://')||!c.supabaseAnonKey||c.supabaseAnonKey.startsWith('COLE_'))throw Error('Configure o arquivo config.js com a URL e a chave pública do Supabase.');return window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey)}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));</script><script>let sb;async function route(){const {data:{user},error}=await sb.auth.getUser();if(error||!user)return;const {data,error:ae}=await sb.from('platform_admins').select('user_id').eq('user_id',user.id).limit(1);if(ae)throw ae;location.replace(data?.length?'master.html':'lojista.html')}(async()=>{try{sb=client();await route()}catch(e){document.getElementById('message').textContent=e.message}})();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('message');msg.textContent='Autenticando...';try{sb=sb||client();const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;await route();msg.textContent='Conta sem painel vinculado. Contate a administração.'}catch(err){msg.textContent=err.message}});</script></body></html>
