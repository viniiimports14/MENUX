<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio | MENUX</title><style>
:root{--accent:#7b2cbf}*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#1c1b20;font:15px/1.5 system-ui,Arial}header{background:#fff;box-shadow:0 2px 12px #0001}.cover{height:230px;background:linear-gradient(120deg,var(--accent),#202027);background-position:center;background-size:cover}.head{max-width:1000px;margin:auto;padding:20px;display:flex;gap:16px;align-items:center}.logo{height:72px;width:72px;object-fit:cover;border-radius:16px;background:#eee;display:none}h1{margin:0;font-size:27px}.muted{color:#696773}.wrap{max-width:1000px;margin:24px auto;padding:0 18px}#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{background:white;border:1px solid #e7e7eb;border-radius:15px;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:1 / 1;height:auto;object-fit:cover;object-position:center;background:#f1f1f3}.body{padding:17px}.price{font-weight:800;color:var(--accent)}.chip{display:inline-block;padding:5px 10px;border-radius:20px;background:#eee;font-size:12px}.error{padding:20px;background:white;border-radius:12px}body.modern{background:#15141a;color:#f5f5f5}body.modern header,body.modern .card{background:#23212b;color:#f5f5f5;border-color:#383440}body.modern .muted{color:#b4b0bb}body.minimal .cover{height:100px}body.minimal .card{border-radius:3px;box-shadow:none}.notice{background:#fff5d6;padding:13px;border-radius:10px;margin-bottom:20px;color:#574a24}
</style></head><body><header><div class="cover" id="cover"></div><div class="head"><img class="logo" id="logo" alt="Logo da loja"><div><h1 id="name">Carregando loja...</h1><div class="muted" id="description"></div></div></div></header><main class="wrap"><div class="notice">Cardápio para consulta. Pedidos online, delivery, retirada e mesa serão ativados em uma próxima etapa.</div><h2>Nosso cardápio</h2><div id="products">Aguarde...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[a-z0-9-]+$/.test(slug))throw Error('Link da loja inválido.');const cfg=window.MENUX_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data,error}=await sb.rpc('get_public_storefront',{p_slug:slug});if(error)throw error;if(!data?.store)throw Error('Loja não encontrada. Confira o endereço.');const s=data.store;document.title=s.name+' | MENUX';document.getElementById('name').textContent=s.name;document.getElementById('description').textContent=s.description||'';document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(s.primary_color)?s.primary_color:'#7b2cbf');document.body.classList.add(['classic','modern','minimal'].includes(s.template)?s.template:'classic');if(s.cover_url?.startsWith('https://'))document.getElementById('cover').style.backgroundImage='url('+JSON.stringify(s.cover_url)+')';if(s.logo_url?.startsWith('https://')){const im=document.getElementById('logo');im.src=s.logo_url;im.style.display='block'}const ps=data.products||[];document.getElementById('products').innerHTML=ps.length?ps.map(p=>'<article class="card">'+(p.image_url?.startsWith('https://')?'<img loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'')+'<div class="body"><span class="chip">'+esc(p.category||'Cardápio')+'</span><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div class="price">'+new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(p.price))+'</div></div></article>').join(''):'Nenhum produto disponível no momento.';}catch(err){document.getElementById('name').textContent='MENUX';document.getElementById('products').innerHTML='<div class="error">Não foi possível carregar o cardápio: '+esc(err.message)+'</div>'}})();
</script></body></html>
