<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio | MENUX</title><style>
:root{--accent:#7b2cbf}*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#1c1b20;font:15px/1.5 system-ui,Arial}header{background:#fff;box-shadow:0 2px 12px #0001}.cover{height:230px;background:linear-gradient(120deg,var(--accent),#202027);background-position:center;background-size:cover}.head{max-width:1000px;margin:auto;padding:20px;display:flex;gap:16px;align-items:center}.logo{height:72px;width:72px;object-fit:cover;border-radius:16px;background:#eee;display:none}h1{margin:0;font-size:27px}.muted{color:#696773}.wrap{max-width:1000px;margin:24px auto;padding:0 18px}#products{display:grid;grid-template-columns:1fr;gap:12px}.card{background:white;border:1px solid #e7e7eb;border-radius:15px;overflow:hidden;display:flex;align-items:center;gap:14px;padding:12px}.card img{display:block;flex:0 0 88px;width:88px;height:88px;aspect-ratio:1/1;object-fit:cover;object-position:center;border-radius:10px;background:#f1f1f3}.body{padding:0;flex:1;min-width:0}.body h3{margin:5px 0 3px;font-size:16px;line-height:1.3}.body p{margin:3px 0 6px;font-size:13px}.price{margin-top:4px}.price{font-weight:800;color:var(--accent)}.chip{display:inline-block;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:11px;font-weight:650}.card .product-photo{display:block;flex:0 0 88px;width:88px;height:88px;padding:0;border:0;border-radius:10px;background:transparent;cursor:zoom-in;overflow:hidden}.card .product-photo img{width:100%;height:100%;object-fit:cover}.card .product-photo:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.image-modal[hidden]{display:none}.image-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:60px 20px 30px;cursor:zoom-out}.image-modal img{display:block;max-width:min(95vw,1100px);max-height:calc(100dvh - 100px);object-fit:contain;border-radius:12px;cursor:default}.image-modal .close-image{position:absolute;top:14px;right:18px;border:1px solid #ffffff66;border-radius:50%;width:42px;height:42px;background:#24242b;color:white;font-size:27px;cursor:pointer}.image-modal .close-image:focus-visible{outline:3px solid white}body.modal-open{overflow:hidden}.error{padding:20px;background:white;border-radius:12px}body.modern{background:#15141a;color:#f5f5f5}body.modern header,body.modern .card{background:#23212b;color:#f5f5f5;border-color:#383440}body.modern .muted{color:#b4b0bb}body.minimal .cover{height:100px}body.minimal .card{border-radius:3px;box-shadow:none}@media(max-width:480px){.card{gap:11px;padding:10px}.card img,.card .product-photo{flex-basis:76px;width:76px;height:76px}.body h3{font-size:15px}}.notice{background:#fff5d6;padding:13px;border-radius:10px;margin-bottom:20px;color:#574a24}
</style><style id="menux-theme-css">:root{--store-bg:#f7f7f8;--store-card:#ffffff;--store-text:#1c1b20;--store-muted:#696773}body,body.modern{background:var(--store-bg);color:var(--store-text)}header,body.modern header,.card,body.modern .card{background:var(--store-card);color:var(--store-text)}.card,body.modern .card{border-color:color-mix(in srgb,var(--store-text) 12%,transparent)}.muted,body.modern .muted{color:var(--store-muted)}.error{background:var(--store-card);color:var(--store-text)}.chip{background:color-mix(in srgb,var(--accent) 13%,var(--store-card))}</style>
<style>
.card{cursor:pointer}.card .product-photo{cursor:zoom-in}
.product-detail[hidden]{display:none!important}
.product-detail{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.72);display:flex;justify-content:center;align-items:center;padding:14px}
.detail-panel{background:var(--store-card);color:var(--store-text);width:min(660px,100%);max-height:96dvh;overflow-y:auto;border-radius:17px;position:relative}
.detail-top{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid #8883;position:sticky;top:0;background:var(--store-card);z-index:1}
.detail-top button{background:transparent;color:inherit;border:0;font-size:24px;cursor:pointer}
.detail-photo{width:100%;height:245px;object-fit:cover;display:block}
.detail-content{padding:18px}.detail-content h2{margin:0 0 7px}
.option-section{border-top:1px solid #8884;padding:17px 0}.option-section h3{margin:0}
.option-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #8882;cursor:pointer}
.option-row{min-height:60px;transition:background .15s ease}.option-row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.option-row input[type="checkbox"]{appearance:none;-webkit-appearance:none;flex:0 0 27px;width:27px;height:27px;margin:0;border:2.5px solid #64748b;border-radius:7px;background:var(--store-card);display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.option-row input[type="checkbox"]::before{content:"";width:13px;height:8px;border-left:3px solid white;border-bottom:3px solid white;transform:translateY(-2px) rotate(-45deg) scale(0);transition:transform .12s ease}
.option-row input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
.option-row input[type="checkbox"]:checked::before{transform:translateY(-2px) rotate(-45deg) scale(1)}
.option-row input[type="checkbox"]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.option-row input[type="checkbox"]:disabled:not(:checked){opacity:.45;cursor:not-allowed}
.option-row:has(input:checked){background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:8px;padding-inline:10px}
@media(hover:none){.option-row{min-height:64px}}
.detail-footer{position:sticky;bottom:0;background:var(--store-card);padding:13px 18px;border-top:1px solid #8884;display:flex;gap:12px;align-items:center;justify-content:space-between}
.detail-footer button{border:0;background:var(--accent);color:white;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}
.detail-footer button:disabled{opacity:.5;cursor:not-allowed}
.detail-note{font-size:12px;opacity:.7}.detail-error{color:#d64c4c;font-size:13px}
@media(max-width:600px){.product-detail{padding:0}.detail-panel{height:100dvh;max-height:100dvh;border-radius:0}.detail-photo{height:210px}}
</style></head><body><header><div class="cover" id="cover"></div><div class="head"><img class="logo" id="logo" alt="Logo da loja"><div><h1 id="name">Carregando loja...</h1><div class="muted" id="description"></div></div></div></header><main class="wrap"><div class="notice">Cardápio para consulta. Pedidos online, delivery, retirada e mesa serão ativados em uma próxima etapa.</div><h2>Nosso cardápio</h2><div id="products">Aguarde...</div></main><div class="product-detail" id="product-detail" role="dialog" aria-modal="true" aria-label="Personalizar produto" hidden>
<div class="detail-panel"><div class="detail-top"><b>Detalhe do produto</b><button id="close-detail" type="button" aria-label="Fechar detalhes">×</button></div><div id="detail-body"></div>
<div class="detail-footer"><div><strong id="detail-total"></strong><div class="detail-note">Prévia de personalização · pedidos ainda indisponíveis</div></div><button type="button" id="detail-confirm" disabled>Em breve: adicionar ao carrinho</button></div></div></div><div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-label="Foto ampliada do produto" hidden><button type="button" class="close-image" aria-label="Fechar imagem">×</button><img id="expanded-image" alt=""></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
let publicProducts=[];const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[a-z0-9-]+$/.test(slug))throw Error('Link da loja inválido.');const cfg=window.MENUX_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data,error}=await sb.rpc('get_public_storefront',{p_slug:slug});if(error)throw error;if(!data?.store)throw Error('Loja não encontrada. Confira o endereço.');const s=data.store;document.title=s.name+' | MENUX';document.getElementById('name').textContent=s.name;document.getElementById('description').textContent=s.description||'';document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(s.primary_color)?s.primary_color:'#7b2cbf');document.body.classList.add(['classic','modern','minimal'].includes(s.template)?s.template:'classic');const isHex=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);const themeDefaults={light:['#F6F3EF','#FFFFFF','#29252A'],dark:['#15141A','#25232C','#F8F7F8'],purple:['#F0EAF7','#FFFFFF','#30233F'],rose:['#F9EFF1','#FFFFFF','#4B303A']};const theme=themeDefaults[s.color_theme]||themeDefaults.light;const colors=[s.background_color,s.card_color,s.text_color].map((v,i)=>isHex(v)?v:theme[i]);const root=document.documentElement;root.style.setProperty('--store-bg',colors[0]);root.style.setProperty('--store-card',colors[1]);root.style.setProperty('--store-text',colors[2]);root.style.setProperty('--store-muted','color-mix(in srgb,'+colors[2]+' 68%, '+colors[1]+')');if(s.cover_url?.startsWith('https://'))document.getElementById('cover').style.backgroundImage='url('+JSON.stringify(s.cover_url)+')';if(s.logo_url?.startsWith('https://')){const im=document.getElementById('logo');im.src=s.logo_url;im.style.display='block'}const ps=data.products||[];publicProducts=ps;document.getElementById('products').innerHTML=ps.length?ps.map(p=>'<article class="card" data-product="'+esc(p.id)+'" tabindex="0" role="button" aria-label="Ver opções de '+esc(p.name)+'">'+(p.image_url?.startsWith('https://')?'<button type="button" class="product-photo" data-image="'+esc(p.image_url)+'" data-name="'+esc(p.name)+'" aria-label="Ampliar foto de '+esc(p.name)+'"><img loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'"></button>':'')+'<div class="body"><span class="chip">'+esc(p.category||'Cardápio')+'</span><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div class="price">'+new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(p.price))+'</div></div></article>').join(''):'Nenhum produto disponível no momento.';}catch(err){document.getElementById('name').textContent='MENUX';document.getElementById('products').innerHTML='<div class="error">Não foi possível carregar o cardápio: '+esc(err.message)+'</div>'}})();
const modal=document.getElementById('image-modal');const expanded=document.getElementById('expanded-image');let lastFocus=null;document.getElementById('products').addEventListener('click',event=>{const button=event.target.closest('.product-photo');if(!button)return;lastFocus=button;expanded.src=button.dataset.image;expanded.alt='Foto ampliada: '+button.dataset.name;modal.hidden=false;document.body.classList.add('modal-open');modal.querySelector('.close-image').focus()});function closeImage(){modal.hidden=true;document.body.classList.remove('modal-open');expanded.removeAttribute('src');lastFocus?.focus()}modal.querySelector('.close-image').addEventListener('click',closeImage);modal.addEventListener('click',event=>{if(event.target===modal)closeImage()});document.addEventListener('keydown',event=>{if(modal.hidden)return;if(event.key==='Escape')closeImage();if(event.key==='Tab'){event.preventDefault();modal.querySelector('.close-image').focus()}});

const detail=$('product-detail'),detailBody=$('detail-body');
let activeProduct=null,selectedOptions={},detailFocus=null;
function $(id){return document.getElementById(id)}
function openDetail(p,origin){
 activeProduct=p;selectedOptions={};detailFocus=origin;
 const groups=p.option_groups||[];
 detailBody.innerHTML=(p.image_url?.startsWith('https://')?'<img class="detail-photo" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'')+
 '<div class="detail-content"><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.description||'')+'</p><p><b>'+brl(p.price)+'</b></p>'+
 groups.map((g,gi)=>'<section class="option-section" data-group="'+gi+'"><h3>'+esc(g.title)+'</h3><p class="muted">Escolha '+(g.min_select>0?'de '+g.min_select+' a ':'até ')+g.max_select+' '+(g.max_select===1?'opção':'opções')+'</p>'+
 (g.items||[]).map((o,oi)=>'<label class="option-row"><span>'+esc(o.name)+(Number(o.price)>0?'<br><small>+'+brl(o.price)+'</small>':'')+'</span><input type="checkbox" data-option="'+gi+'-'+oi+'" aria-label="'+esc(o.name)+'"></label>').join('')+'</section>').join('')+'</div>';
 detail.hidden=false;document.body.classList.add('modal-open');$('close-detail').focus();updateDetail();
}
function updateDetail(){
 if(!activeProduct)return;
 let price=Number(activeProduct.price)||0;const groups=activeProduct.option_groups||[];
 groups.forEach((g,gi)=>{
  let count=0;
  (g.items||[]).forEach((o,oi)=>{const input=detailBody.querySelector('[data-option="'+gi+'-'+oi+'"]');if(!input)return;input.checked=!!selectedOptions[gi+'-'+oi];if(input.checked){count++;price+=Number(o.price)||0;}});
  (g.items||[]).forEach((o,oi)=>{const input=detailBody.querySelector('[data-option="'+gi+'-'+oi+'"]');if(input)input.disabled=!input.checked&&count>=g.max_select;});
 });
 $('detail-total').textContent='Total: '+brl(price);
}
function closeDetail(){detail.hidden=true;document.body.classList.remove('modal-open');activeProduct=null;detailFocus?.focus();}
$('products').addEventListener('click',e=>{if(e.target.closest('.product-photo'))return;const card=e.target.closest('[data-product]');if(!card)return;const p=publicProducts.find(x=>String(x.id)===card.dataset.product);if(p)openDetail(p,card);});
$('products').addEventListener('keydown',e=>{if(e.target.closest('.product-photo'))return;if(e.key==='Enter'||e.key===' '){const card=e.target.closest('[data-product]');if(card){e.preventDefault();card.click();}}});
detailBody.addEventListener('change',e=>{const input=e.target.closest('[data-option]');if(!input)return;selectedOptions[input.dataset.option]=input.checked;updateDetail();});
$('close-detail').addEventListener('click',closeDetail);
detail.addEventListener('click',e=>{if(e.target===detail)closeDetail();});
document.addEventListener('keydown',e=>{if(detail.hidden)return;if(e.key==='Escape')closeDetail();if(e.key==='Tab'){const focusable=[...detail.querySelectorAll('button:not([disabled]),input:not([disabled])')];if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
</script></body></html>
